spring:
  application:
    name: smartrent-backend
  main:
    allow-bean-definition-overriding: false
    allow-circular-references: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    placeholders:
      applicationRole: ${DB_USERNAME}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

smartrent:
  dev-accounts:
    enabled: ${SMARTRENT_DEV_ACCOUNTS_ENABLED:false}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never

# PostgreSQL error detail may contain a rejected row (PII/hash). Expose only safe API errors.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
